<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>4位玩家，1位赢家，0个朋友 · 王座墙棋</title>
<style>
  :root{ --bg:#070b14; --text:#dfe7f5; --dim:#8fa0bd; }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #101a30 0%, var(--bg) 60%);
    color:var(--text); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100%;
    overflow-x:hidden;
  }
  header{ text-align:center; padding:16px 12px 4px; }
  header h1{
    font-size:clamp(20px,3.4vw,30px); letter-spacing:1px; font-weight:800;
    background:linear-gradient(90deg,#5db9ff,#ff5d8f,#2ee38a,#ffb62e);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header .tag{ color:var(--dim); font-size:12px; margin-top:4px; letter-spacing:2px;}
  #wrap{ display:flex; gap:18px; align-items:flex-start; justify-content:center; padding:10px 14px 26px; flex:1; width:100%; max-width:1100px;}
  #boardBox{ position:relative; }
  canvas{ display:block; border-radius:14px; }
  #side{ width:232px; flex:0 0 232px; display:flex; flex-direction:column; gap:10px;}
  .card{ background:rgba(13,19,34,.82); border:1px solid #1b2438; border-radius:14px; padding:12px;}
  .card h3{ font-size:12px; color:var(--dim); letter-spacing:2px; margin-bottom:8px; font-weight:600;}
  .prow{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:10px; margin-bottom:6px; transition:.25s; border:1px solid transparent;}
  .prow.active{ background:rgba(255,255,255,.055); border-color:#263250;}
  .dot{ width:14px; height:14px; border-radius:50%; flex:0 0 14px; box-shadow:0 0 8px 1px currentColor; background:currentColor;}
  .pname{ font-size:13px; font-weight:600; flex:1; white-space:nowrap;}
  .tagyou{ font-size:10px; color:#0a0f1a; background:#cfe0ff; border-radius:6px; padding:1px 5px; font-weight:700; margin-right:3px;}
  .wnum{ font-size:11px; font-weight:700; color:currentColor; white-space:nowrap;}
  .steps{ font-size:11px; color:var(--dim); flex:0 0 auto; text-align:right; white-space:nowrap;}
  button{
    background:#16203a; color:var(--text); border:1px solid #263252; border-radius:10px;
    padding:9px 10px; font-size:13px; cursor:pointer; font-family:inherit; transition:.15s;
  }
  button:hover{ background:#1c2949; border-color:#33447a;}
  button.primary{ background:linear-gradient(135deg,#1a56c9,#3f8cff); border-color:#4f8dff; font-weight:700;}
  button.primary:hover{ filter:brightness(1.12);}
  .btnrow{ display:flex; gap:8px; }
  .btnrow button{ flex:1; }
  select{
    width:100%; background:#16203a; color:var(--text); border:1px solid #263252;
    border-radius:10px; padding:9px 8px; font-size:13px; font-family:inherit; outline:none;
  }
  #hint{ font-size:12px; color:var(--dim); line-height:1.75;}
  #hint b{ color:var(--text);}
  #overlay{
    position:fixed; inset:0; background:rgba(4,7,14,.72); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  #overlay.show{ display:flex;}
  .panel{
    background:linear-gradient(160deg,#121a2e,#0c1220); border:1px solid #27345a;
    border-radius:20px; padding:26px 32px; text-align:center; max-width:430px; width:92%;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
  }
  .panel h2{ font-size:26px; margin-bottom:6px;}
  .panel .sub{ color:var(--dim); font-size:13px; margin-bottom:16px;}
  #rules{ text-align:left; font-size:13px; line-height:1.9; color:#c6d3ea; margin:4px 0 16px;}
  #rules b{ color:var(--gold, #fdca00);}
  .legend{ display:flex; gap:14px; justify-content:center; margin:8px 0 16px; font-size:12px; color:var(--dim); flex-wrap:wrap;}
  .legend span{ display:flex; align-items:center; gap:5px;}
  .legend i{ width:11px;height:11px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor;}
  @media (max-width:820px){
    #wrap{ flex-direction:column; align-items:center;}
    #side{ width:100%; max-width:520px; flex:none; flex-direction:row; flex-wrap:wrap;}
    #side .card{ flex:1 1 45%;}
  }
</style>
</head>
<body>
<header>
  <h1>4位玩家，1位赢家，0个朋友</h1>
  <div class="tag">四 人 抢 座 · 墙 棋 大 逃 杀</div>
</header>

<div id="wrap">
  <div id="boardBox"><canvas id="cv"></canvas></div>
  <div id="side">
    <div class="card">
      <h3>玩家</h3>
      <div id="plist"></div>
    </div>
    <div class="card">
      <h3>模式</h3>
      <select id="modeSel">
        <option value="pve">经典 · 我打 3 个 AI</option>
        <option value="hotseat">经典 · 4 人同屏热座</option>
        <option value="sync">同步 · 实时乱斗（我 + 3 AI）</option>
        <option value="syncspec">同步 · 4 AI 实时互坑（观战）</option>
        <option value="spectate">观战 · 4 个 AI 互坑</option>
      </select>
      <div style="height:8px"></div>
      <select id="sizeSel">
        <option value="9">地图 9×9 · 紧凑</option>
        <option value="11" selected>地图 11×11 · 标准</option>
        <option value="13">地图 13×13 · 大</option>
        <option value="15">地图 15×15 · 超大</option>
      </select>
      <div style="height:8px"></div>
      <select id="wallSel">
        <option value="5">每人 5 堵墙</option>
        <option value="8" selected>每人 8 堵墙</option>
        <option value="12">每人 12 堵墙</option>
        <option value="16">每人 16 堵墙</option>
        <option value="20">每人 20 堵墙</option>
      </select>
      <div style="height:10px"></div>
      <div class="btnrow">
        <button class="primary" id="btnNew">开新一局</button>
        <button id="btnRules">规则</button>
      </div>
      <div style="height:8px"></div>
      <div class="btnrow">
        <button id="btnMute">🔊 音效</button>
        <button id="btnSpeed" title="AI 行棋速度">⚡ 正常</button>
      </div>
    </div>
    <div class="card" id="hint">
      <b>每回合二选一</b><br>
      ① 点击相邻格子 = 走一步（可跳过贴脸的棋子）<br>
      ② 点击格线缝隙 = 放一堵墙（占2格，永久，自己颜色）<br>
      <b>获胜</b>：第一个踏上中央 👑 王座。<br>
      墙不能穿过、不能重叠，也不许把任何人<b>彻底堵死</b>。
    </div>
  </div>
</div>

<div id="overlay"><div class="panel" id="ovPanel"></div></div>

<script>
"use strict";
/* ================= 常量 ================= */
let N = 11;
const THRONE = {x:5, y:5};
const COLORS = {
  blue:  {main:'#0f9ceb', name:'蓝方', rgb:[15,156,235]},
  green: {main:'#17d76c', name:'绿方', rgb:[23,215,108]},
  red:   {main:'#e02955', name:'红方', rgb:[224,41,85]},
  orange:{main:'#f5a307', name:'橙方', rgb:[245,163,7]},
};
const SPAWN = {blue:{x:5,y:0}, green:{x:0,y:5}, red:{x:10,y:5}, orange:{x:5,y:10}};
function setBoardSize(n){          // 四家出生点到王座始终等距
  N = n; const c = (N-1)/2;
  THRONE.x = THRONE.y = c;
  SPAWN.blue = {x:c,y:0}; SPAWN.green = {x:0,y:c}; SPAWN.red = {x:N-1,y:c}; SPAWN.orange = {x:c,y:N-1};
}
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

/* ================= 状态 ================= */
let wallsH = new Set();   // "x,y"：横墙，挡住 (x,y-1)/(x,y) 与 (x+1,y-1)/(x+1,y) 的竖向通行
let wallsV = new Set();   // "x,y"：竖墙，挡住 (x-1,y)/(x,y) 与 (x-1,y+1)/(x,y+1) 的横向通行
let wallOwner = {};       // "h x,y" / "v x,y" -> color
let players = [];
let turnIdx = 0, winner = null, busy = false, turnCount = 0, passStreak = 0;
let mode = 'pve', wallStock = 8, muted = false, fastAI = false;
let confetti = [], fx = [], toastMsg = null;
let aiTimer = null;
const SYNC_CD = 500;      // 同步模式：动作间隔（毫秒）
const SYNC_APMAX = 3;     // 同步模式：操作点上限
function isSyncMode(){ return mode==='sync' || mode==='syncspec'; }

/* ================= 种子随机（可复现） ================= */
let RNGSEED = 1;
function srand(s){ RNGSEED = (s>>>0)||1; }
function rnd(){ RNGSEED = (RNGSEED*1103515245 + 12345) & 0x7fffffff; return RNGSEED/0x7fffffff; }
const Q = new URLSearchParams(location.search);
if (Q.get('mode')) mode = Q.get('mode');
if (Q.get('walls')) wallStock = Math.max(1, Math.min(20, +Q.get('walls')||8));
if (Q.get('size')){ const n=+Q.get('size'); if([9,11,13,15].includes(n)) setBoardSize(n); }
if (Q.get('fast') === '1') fastAI = true;
srand(Q.get('seed') ? +Q.get('seed') : ((Date.now()*2654435761)>>>0));

/* ================= 音效（WebAudio 合成） ================= */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freq, dur, type, gain, slide){
  if (muted) return; const c = ac(); if(!c) return;
  try{
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq, c.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), c.currentTime+dur);
    g.gain.setValueAtTime(gain||.12, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+dur);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur+.03);
  }catch(e){}
}
const sMove=()=>beep(320,.07,'triangle',.09,-90);
const sJump=()=>beep(420,.1,'triangle',.1,180);
const sWall=()=>{ beep(130,.14,'square',.09,-50); beep(85,.2,'sine',.12,-30); };
const sBad =()=>beep(150,.12,'sawtooth',.06,-70);
const sWin =()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.22,'triangle',.15),i*130));

/* ================= 规则核心 ================= */
const K=(x,y)=>x+','+y;
const inB=(x,y)=>x>=0&&x<N&&y>=0&&y<N;

function blocked(x1,y1,x2,y2){
  if (x2===x1+1) return wallsV.has(K(x2,y1)) || wallsV.has(K(x2,y1-1));
  if (x2===x1-1) return wallsV.has(K(x1,y1)) || wallsV.has(K(x1,y1-1));
  if (y2===y1+1) return wallsH.has(K(x1,y2)) || wallsH.has(K(x1-1,y2));
  if (y2===y1-1) return wallsH.has(K(x1,y1)) || wallsH.has(K(x1-1,y1));
  return true;
}
function pawnAt(x,y){ return players.find(p=>!p.left && p.cell.x===x && p.cell.y===y); }
function cur(){ return players[turnIdx]; }

function bfsFromThrone(wH, wV){
  const reach = new Uint8Array(N*N), dist = new Int16Array(N*N).fill(-1);
  const q=[[THRONE.x,THRONE.y]]; const si=THRONE.y*N+THRONE.x;
  reach[si]=1; dist[si]=0;
  for(let h=0;h<q.length;h++){
    const [x,y]=q[h], d=dist[y*N+x];
    for(const[dx,dy]of DIRS){
      const nx=x+dx, ny=y+dy;
      if(!inB(nx,ny)) continue;
      if (dx===1)  { if (wV.has(K(nx,y))||wV.has(K(nx,y-1))) continue; }
      else if(dx===-1){ if (wV.has(K(x,y))||wV.has(K(x,y-1))) continue; }
      else if(dy===1) { if (wH.has(K(x,ny))||wH.has(K(x-1,ny))) continue; }
      else            { if (wH.has(K(x,y))||wH.has(K(x-1,y))) continue; }
      const i=ny*N+nx;
      if(!reach[i]){ reach[i]=1; dist[i]=d+1; q.push([nx,ny]); }
    }
  }
  return {reach, dist};
}
function everyoneHasPath(wH, wV){
  const {reach} = bfsFromThrone(wH, wV);
  return players.every(p=>p.left || reach[p.cell.y*N+p.cell.x]);
}
function allDists(wH, wV){
  const {dist} = bfsFromThrone(wH||wallsH, wV||wallsV);
  const m={}; for(const p of players) if(!p.left) m[p.color]=dist[p.cell.y*N+p.cell.x];
  return m;
}

function legalMoves(p){
  const res=[]; const {x,y}=p.cell;
  for(const[dx,dy]of DIRS){
    const nx=x+dx, ny=y+dy;
    if(!inB(nx,ny)||blocked(x,y,nx,ny)) continue;
    const occ = pawnAt(nx,ny);
    if(!occ) res.push({x:nx,y:ny});
    else{
      const jx=nx+dx, jy=ny+dy;   // 直线跳过贴脸棋子
      if(inB(jx,jy)&&!blocked(nx,ny,jx,jy)&&!pawnAt(jx,jy)) res.push({x:jx,y:jy});
    }
  }
  return res;
}

function wallBoundsOK(kind,x,y){
  return kind==='h' ? (x>=0&&x<=N-2&&y>=1&&y<=N-1)
                    : (x>=1&&x<=N-1&&y>=0&&y<=N-2);
}
function wallClash(kind,x,y){
  if(kind==='h'){
    for(const key of wallsH){ const[a,b]=key.split(',').map(Number); if(b===y&&Math.abs(a-x)<2) return true; }
    for(const key of wallsV){ const[a,b]=key.split(',').map(Number); if(a===x+1&&b===y-1) return true; }
  }else{
    for(const key of wallsV){ const[a,b]=key.split(',').map(Number); if(a===x&&Math.abs(b-y)<2) return true; }
    for(const key of wallsH){ const[a,b]=key.split(',').map(Number); if(b===y+1&&a===x-1) return true; }
  }
  return false;
}
function wallOK(kind,x,y){
  if(!wallBoundsOK(kind,x,y)) return false;
  if(wallClash(kind,x,y)) return false;
  const sH = kind==='h' ? new Set(wallsH) : wallsH;
  const sV = kind==='v' ? new Set(wallsV) : wallsV;
  if(kind==='h') sH.add(K(x,y)); else sV.add(K(x,y));
  return everyoneHasPath(sH, sV);
}
function allWallSpots(){
  const out=[];
  for(let y=1;y<N;y++) for(let x=0;x<N-1;x++) if(wallOK('h',x,y)) out.push(['h',x,y]);
  for(let y=0;y<N-1;y++) for(let x=1;x<N;x++) if(wallOK('v',x,y)) out.push(['v',x,y]);
  return out;
}
function hasAnyAction(p){
  if (legalMoves(p).length) return true;
  return p.walls>0 && allWallSpots().length>0;
}

/* ================= 开局 ================= */
function newGame(){
  clearTimeout(aiTimer);
  wallsH.clear(); wallsV.clear(); wallOwner = {};
  players = ['blue','green','red','orange'].map(c=>{
    const human = (mode==='hotseat') || ((mode==='pve'||mode==='sync') && c==='blue');
    return {
      color:c, cell:{...SPAWN[c]},
      walls:wallStock, left:false,
      ai:(mode==='spectate') || (mode!=='hotseat' && !human),
      human,
      tween:null, ap:SYNC_APMAX, lastAct:0, nextThink:0, bank:false, burstLeft:0,
    };
  });
  turnIdx = Math.floor(rnd()*4);
  winner = null; busy = false; turnCount = 0; passStreak = 0;
  confetti = []; fx = []; toastMsg = null;
  document.getElementById('overlay').classList.remove('show');
  layout();
  buildPanel(); renderPanel(); syncSelects();
  refreshHint();
  if (!isSyncMode()){ autoPassIfNeeded(); scheduleAI(); }
}

/* ================= 行动执行 ================= */
function spendAP(p){ p.ap = Math.max(0, p.ap-1); p.lastAct = performance.now(); }
function doMove(p, cell){
  const jump = Math.abs(p.cell.x-cell.x)+Math.abs(p.cell.y-cell.y) > 1;
  p.tween = {fx:p.cell.x, fy:p.cell.y, t0:performance.now()};
  p.cell = {x:cell.x, y:cell.y};
  passStreak = 0; turnCount++;
  jump ? sJump() : sMove();
  if (cell.x===THRONE.x && cell.y===THRONE.y){ endGame(p); return; }
  if (isSyncMode()){ spendAP(p); renderPanel(); return; }
  nextTurn();
}
function doWall(p, kind, x, y){
  (kind==='h'?wallsH:wallsV).add(K(x,y));
  wallOwner[kind+' '+K(x,y)] = p.color;
  p.walls--;
  passStreak = 0; turnCount++;
  sWall();
  fx.push({type:'wallpop', kind, x, y, t0:performance.now()});
  if (isSyncMode()){ spendAP(p); renderPanel(); return; }
  nextTurn();
}
function nextTurn(){
  if (winner) return;
  turnIdx = (turnIdx+1)%players.length;
  renderPanel();
  autoPassIfNeeded();
  scheduleAI();
}
function autoPassIfNeeded(){
  if (winner) return;
  const p = cur();
  if (!hasAnyAction(p)){
    toast(COLORS[p.color].name+' 无路可走，跳过');
    passStreak++;
    if (passStreak >= players.length*2){ endDraw(); return; }
    turnIdx = (turnIdx+1)%players.length;
    renderPanel();
    autoPassIfNeeded();
  }
}
function endDraw(){
  winner = 'draw'; busy = true;
  const ov=document.getElementById('overlay'), pn=document.getElementById('ovPanel');
  pn.innerHTML = `<h2>🤝 谁也到不了王座</h2>
    <div class="sub">互相筑墙的代价 —— 平局（0个朋友实锤）</div>
    <div class="btnrow"><button class="primary" id="btnAgain">再来一局</button></div>`;
  ov.classList.add('show');
  document.getElementById('btnAgain').onclick=()=>newGame();
}
function endGame(p){
  winner = p; busy = true;
  sWin(); spawnConfetti();
  renderPanel();
  const ov=document.getElementById('overlay'), pn=document.getElementById('ovPanel');
  pn.innerHTML = `
    <h2 style="color:${COLORS[p.color].main}; text-shadow:0 0 24px ${COLORS[p.color].main}66">
      👑 ${COLORS[p.color].name} 获胜！</h2>
    <div class="sub">4位玩家 · 1位赢家 · 0个朋友 —— 共 ${turnCount} 手</div>
    <div class="legend">
      ${players.map(q=>`<span style="color:${COLORS[q.color].main}"><i></i>${COLORS[q.color].name}${q===p?' 👑':''}</span>`).join('')}
    </div>
    <div class="btnrow">
      <button class="primary" id="btnAgain">再来一局</button>
      <button id="btnWatch">看 AI 互坑</button>
    </div>`;
  ov.classList.add('show');
  document.getElementById('btnAgain').onclick = ()=>newGame();
  document.getElementById('btnWatch').onclick = ()=>{ mode='spectate'; newGame(); };
  if (mode==='spectate' || mode==='syncspec') setTimeout(()=>{ if(winner===p) newGame(); }, 5000);
}
function toast(t){ toastMsg={text:t, t0:performance.now()}; }

/* ================= AI ================= */
function scheduleAI(){
  if (winner) return;
  const p = cur();
  if (p.ai){
    clearTimeout(aiTimer);
    aiTimer = setTimeout(()=>{ if(!winner && cur()===p && p.ai) aiTurn(); }, fastAI?16:110);
  }
}
function aiTurn(){
  const p = cur();
  if (winner || !p.ai) return;
  const dists = allDists();
  const myD = dists[p.color];
  const opps = players.filter(q=>q!==p && !q.left);
  const minOppD = Math.min(...opps.map(q=>dists[q.color]));

  if (myD <= 1){
    const ms = legalMoves(p);
    if (ms.length){ aiAct(p, 'move', bestToward(p, ms)); return; }
  }
  // 评估放墙
  let bestWall=null, bestScore=1.6 + rnd()*0.8;
  if (p.walls>0){
    const spots = allWallSpots();
    for(let i=spots.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [spots[i],spots[j]]=[spots[j],spots[i]]; }
    let checked=0;
    for(const [k,x,y] of spots){
      if(++checked>160) break;
      const sH=k==='h'?new Set(wallsH):wallsH, sV=k==='v'?new Set(wallsV):wallsV;
      if(k==='h') sH.add(K(x,y)); else sV.add(K(x,y));
      const d2 = allDists(sH,sV);
      let hurt=0;
      for(const q of opps){
        const before=dists[q.color], after=d2[q.color];
        const gain=after-before;
        if(gain>0) hurt += gain * (1 + Math.max(0,(6-before))*0.35);
      }
      const selfCost = myD - d2[p.color];
      const score = hurt - selfCost*1.35 + rnd()*0.5;
      if (score>bestScore){ bestScore=score; bestWall=[k,x,y]; }
    }
  }
  if (!bestWall && minOppD<=2 && p.walls>0){
    const spots=allWallSpots().sort(()=>rnd()-0.5);
    for(const [k,x,y] of spots){
      const sH=k==='h'?new Set(wallsH):wallsH, sV=k==='v'?new Set(wallsV):wallsV;
      if(k==='h') sH.add(K(x,y)); else sV.add(K(x,y));
      const d2=allDists(sH,sV);
      if (opps.some(q=>d2[q.color]>dists[q.color]) && d2[p.color]>=0){ bestWall=[k,x,y]; break; }
    }
  }
  if (bestWall && rnd()>0.06){ aiAct(p,'wall',bestWall); return; }
  const ms=legalMoves(p);
  if (ms.length) aiAct(p,'move',bestToward(p,ms));
  else if (bestWall) aiAct(p,'wall',bestWall);
}
function bestToward(p, ms){
  const {dist}=bfsFromThrone(wallsH,wallsV);
  let best=ms[0], bd=1e9;
  for(const c of ms){ const d=dist[c.y*N+c.x]; if(d>=0&&d<bd){bd=d;best=c;} }
  return best;
}
function aiAct(p, kind, arg){
  busy = true;
  setTimeout(()=>{
    busy = false;
    if (winner) return;
    if (kind==='move') doMove(p, arg);
    else doWall(p, arg[0], arg[1], arg[2]);
  }, fastAI ? 18 : 130 + rnd()*150);
}

/* ---- 同步模式：实时驱动 ---- */
function syncAIDriver(now){
  if (winner) return;
  for(const p of players){
    if (!p.ai) continue;
    if (now - p.lastAct < SYNC_CD) continue;
    if (p.ap < 1) continue;
    if (p.bank && p.ap < SYNC_APMAX) continue;   // 攒点中：等回满
    if (p.bank && p.ap >= SYNC_APMAX - 1e-6){    // 攒满 → 解锁连发
      p.bank = false;
      p.burstLeft = 1 + Math.floor(rnd()*3);     // 本次之后还连 1~3 手
    }
    if (now < p.nextThink) continue;
    p.nextThink = now + 60 + rnd()*180;
    const acted = syncAIDecide(p);
    if (!acted || winner) continue;
    if (p.burstLeft > 0){
      p.burstLeft--;                              // 连发中
    }else if (rnd() < 0.5){
      p.bank = true;                              // 转入攒点
    }
  }
}
function syncAIDecide(p){
  const dists = allDists();
  const myD = dists[p.color];
  const opps = players.filter(q=>q!==p && !q.left);
  if (myD <= 1){
    const ms = legalMoves(p);
    if (ms.length){ doMove(p, bestToward(p, ms)); return true; }
  }
  let bestWall=null, bestScore=1.6 + rnd()*0.8;
  if (p.walls>0){
    const spots = allWallSpots();
    for(let i=spots.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [spots[i],spots[j]]=[spots[j],spots[i]]; }
    let checked=0;
    for(const [k,x,y] of spots){
      if(++checked>140) break;
      const sH=k==='h'?new Set(wallsH):wallsH, sV=k==='v'?new Set(wallsV):wallsV;
      if(k==='h') sH.add(K(x,y)); else sV.add(K(x,y));
      const d2 = allDists(sH,sV);
      let hurt=0;
      for(const q of opps){
        const gain=d2[q.color]-dists[q.color];
        if(gain>0) hurt += gain * (1 + Math.max(0,(6-dists[q.color]))*0.35);
      }
      const selfCost = myD - d2[p.color];
      const score = hurt - selfCost*1.35 + rnd()*0.5;
      if (score>bestScore){ bestScore=score; bestWall=[k,x,y]; }
    }
  }
  if (bestWall && rnd()>0.10){ doWall(p, bestWall[0], bestWall[1], bestWall[2]); return true; }
  const ms=legalMoves(p);
  if (ms.length){ doMove(p, bestToward(p,ms)); return true; }
  if (bestWall){ doWall(p, bestWall[0], bestWall[1], bestWall[2]); return true; }
  return false;
}

/* ================= 人类输入 ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let CELL = 48, PAD = 16, boardPx = 0, hover = null;

function px(v){ return PAD + v*CELL; }

cv.addEventListener('mousemove', e=>{
  const r=cv.getBoundingClientRect();
  hover = {gx:e.clientX-r.left, gy:e.clientY-r.top};
});
cv.addEventListener('mouseleave', ()=>hover=null);
cv.addEventListener('click', e=>{
  ac();
  if (winner||busy) return;
  let p;
  if (isSyncMode()){
    if (!players[0].human) return;         // 纯观战变体：无人类操作
    p = players[0];
    const now = performance.now();
    if (now - p.lastAct < SYNC_CD){ toast('太快了！动作间隔 0.5 秒'); sBad(); return; }
    if (p.ap < 1){ toast('操作点不足，等它恢复'); sBad(); return; }
  }else{
    p = cur(); if (!p.human) return;
  }
  const r=cv.getBoundingClientRect();
  const gx=e.clientX-r.left, gy=e.clientY-r.top;
  const cx=(gx-PAD)/CELL, cy=(gy-PAD)/CELL;

  // ① 靠近格线 → 放墙
  const w = snapWall(cx, cy);
  if (w){
    const [k,x,y]=w;
    if (p.walls<=0){ toast('你的墙用完了！'); sBad(); return; }
    if (!wallOK(k,x,y)){
      toast(wallClash(k,x,y) ? '这里放不了墙' : '不能把人彻底堵死！');
      sBad(); return;
    }
    doWall(p,k,x,y);
    return;
  }
  // ② 点格子 → 移动
  const tx=Math.round(cx-0.5), ty=Math.round(cy-0.5);
  if (inB(tx,ty)){
    const ms = legalMoves(p);
    const hit = ms.find(c=>c.x===tx&&c.y===ty);
    if (hit){ doMove(p,hit); return; }
    if (tx===p.cell.x&&ty===p.cell.y){ toast('点相邻格移动，或点格线缝隙放墙'); return; }
    toast(ms.length ? '走不到那里' : '你被困住了！');
    sBad();
  }
});
// 吸附最近的可放墙位置：光标靠近哪条格线，就沿哪条线放
function snapWall(cx, cy){
  const dV = Math.abs(cx - Math.round(cx));   // 离竖直格线
  const dH = Math.abs(cy - Math.round(cy));   // 离水平格线
  const TH = 0.32;
  if (Math.min(dV,dH) >= TH) return null;
  if (dV <= dH){
    const vx = Math.round(cx);
    const vy = Math.max(0, Math.min(N-2, Math.round(cy-1)));
    return ['v', vx, vy];
  }else{
    const hy = Math.round(cy);
    const hx = Math.max(0, Math.min(N-2, Math.round(cx-1)));
    return ['h', hx, hy];
  }
}

/* ================= 渲染 ================= */
if (!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath();
  };
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }

function layout(){
  const narrow = window.innerWidth <= 820;
  const maxW = narrow ? window.innerWidth-36 : window.innerWidth-330;
  const maxH = window.innerHeight - 170;
  boardPx = Math.max(300, Math.min(maxW, maxH, N>=13?680:620));
  const dpr = window.devicePixelRatio||1;
  cv.width = Math.round(boardPx*dpr); cv.height = Math.round(boardPx*dpr);
  cv.style.width = boardPx+'px'; cv.style.height = boardPx+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  CELL = (boardPx - PAD*2)/N;
}
window.addEventListener('resize', layout);

let lastFrame = performance.now();
function draw(now){
  const dt = Math.min(.05,(now-lastFrame)/1000); lastFrame = now;
  if (isSyncMode() && !winner){
    for(const p of players) p.ap = Math.min(SYNC_APMAX, p.ap + dt);   // 每秒回1点
    syncAIDriver(now);
  }
  ctx.clearRect(0,0,boardPx,boardPx);

  const g = ctx.createLinearGradient(0,0,boardPx,boardPx);
  g.addColorStop(0,'#0c1322'); g.addColorStop(1,'#0a101d');
  rr(0,0,boardPx,boardPx,14); ctx.fillStyle=g; ctx.fill();

  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    ctx.fillStyle = '#141b2b';
    rr(px(x)+1.5, px(y)+1.5, CELL-3, CELL-3, Math.max(4,CELL*0.14));
    ctx.fill();
  }
  ctx.fillStyle='rgba(120,150,210,.14)';
  for(let y=0;y<=N;y++) for(let x=0;x<=N;x++){
    ctx.beginPath(); ctx.arc(px(x),px(y),1.6,0,7); ctx.fill();
  }

  // 王座
  const pulse = 0.5+0.5*Math.sin(now/500);
  ctx.save();
  ctx.shadowColor='rgba(253,202,0,'+(0.45+0.3*pulse).toFixed(2)+')'; ctx.shadowBlur=18+8*pulse;
  ctx.fillStyle='#fdca00';
  rr(px(THRONE.x)+2.5, px(THRONE.y)+2.5, CELL-5, CELL-5, Math.max(5,CELL*0.16)); ctx.fill();
  ctx.restore();
  ctx.font = Math.floor(CELL*0.46)+'px serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('👑', px(THRONE.x)+CELL/2, px(THRONE.y)+CELL/2+2);

  // 当前人类玩家合法移动提示
  const cp = winner?null:(isSyncMode() ? (players[0].human?players[0]:null) : cur());
  if (cp && cp.human && !busy){
    ctx.fillStyle='rgba(255,255,255,.10)';
    for(const c of legalMoves(cp)){
      ctx.beginPath(); ctx.arc(px(c.x)+CELL/2, px(c.y)+CELL/2, CELL*0.12, 0, 7); ctx.fill();
    }
  }

  // 墙
  const WT = Math.max(5, CELL*0.14);
  ctx.lineCap='round'; ctx.lineWidth=WT;
  for(const key of wallsH){
    const[a,b]=key.split(',').map(Number);
    const col = COLORS[wallOwner['h '+key]]?.main || '#7f8db0';
    ctx.strokeStyle=col; ctx.shadowColor=col; ctx.shadowBlur=7;
    ctx.beginPath(); ctx.moveTo(px(a),px(b)); ctx.lineTo(px(a+2),px(b)); ctx.stroke();
  }
  for(const key of wallsV){
    const[a,b]=key.split(',').map(Number);
    const col = COLORS[wallOwner['v '+key]]?.main || '#7f8db0';
    ctx.strokeStyle=col; ctx.shadowColor=col; ctx.shadowBlur=7;
    ctx.beginPath(); ctx.moveTo(px(a),px(b)); ctx.lineTo(px(a),px(b+2)); ctx.stroke();
  }
  ctx.shadowBlur=0;

  // 墙 hover 预览
  if (cp && cp.human && !busy && hover){
    const cx=(hover.gx-PAD)/CELL, cy=(hover.gy-PAD)/CELL;
    const w = snapWall(cx,cy);
    if (w){
      const [k,x,y]=w;
      const ok = cp.walls>0 && wallOK(k,x,y);
      ctx.save(); ctx.globalAlpha=.55;
      ctx.strokeStyle = ok ? COLORS[cp.color].main : '#ff4d4d';
      ctx.lineWidth=WT; ctx.lineCap='round';
      ctx.beginPath();
      if(k==='h'){ ctx.moveTo(px(x),px(y)); ctx.lineTo(px(x+2),px(y)); }
      else{ ctx.moveTo(px(x),px(y)); ctx.lineTo(px(x),px(y+2)); }
      ctx.stroke(); ctx.restore();
    }
  }

  // 棋子
  for(const p of players){
    let X=px(p.cell.x)+CELL/2, Y=px(p.cell.y)+CELL/2;
    if (p.tween){
      const t=Math.min(1,(now-p.tween.t0)/170);
      const e=1-Math.pow(1-t,3);
      X=px(p.tween.fx+(p.cell.x-p.tween.fx)*e)+CELL/2;
      Y=px(p.tween.fy+(p.cell.y-p.tween.fy)*e)+CELL/2;
      if(t>=1) p.tween=null;
    }
    const isCur = !isSyncMode() && p===cp;
    if (isSyncMode()){
      if (!p.ai){
        const cd = Math.max(0, SYNC_CD-(now-p.lastAct))/SYNC_CD;
        if (cd>0){                       // 冷却进度环
          ctx.strokeStyle='rgba(255,255,255,.30)'; ctx.lineWidth=2.5;
          ctx.beginPath(); ctx.arc(X,Y,CELL*0.46,-Math.PI/2,-Math.PI/2+(1-cd)*Math.PI*2); ctx.stroke();
        }else if (p.ap>=1){              // 可行动：呼吸环
          ctx.strokeStyle='rgba(255,255,255,'+(0.45+0.3*Math.sin(now/220)).toFixed(2)+')';
          ctx.lineWidth=2.5;
          ctx.beginPath(); ctx.arc(X,Y,CELL*0.42+2.5+Math.sin(now/220)*1.2,0,7); ctx.stroke();
        }
      }
    }else if (p===cp){
      ctx.strokeStyle='rgba(255,255,255,'+(0.5+0.35*Math.sin(now/220)).toFixed(2)+')';
      ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(X,Y,CELL*0.42+3+Math.sin(now/220)*1.5,0,7); ctx.stroke();
    }
    const [r,g2,b]=COLORS[p.color].rgb;
    const moving = !!p.tween;                 // 移动中不发光，避免辉光拖影
    ctx.save();
    ctx.shadowColor=`rgba(${r},${g2},${b},.8)`; ctx.shadowBlur = moving ? 0 : (isCur?16:9);
    const rg=ctx.createRadialGradient(X-CELL*0.1,Y-CELL*0.12,1,X,Y,CELL*0.36);
    rg.addColorStop(0,`rgb(${Math.min(255,r+70)},${Math.min(255,g2+70)},${Math.min(255,b+70)})`);
    rg.addColorStop(1,COLORS[p.color].main);
    ctx.fillStyle=rg;
    ctx.beginPath(); ctx.arc(X,Y,CELL*0.32,0,7); ctx.fill();
    ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(X-CELL*0.09,Y-CELL*0.11,CELL*0.08,0,7); ctx.fill();
    if (isSyncMode()){                     // 操作点气泡：3格，亮=可用；攒点中变金色
      for(let i=0;i<SYNC_APMAX;i++){
        const f = Math.max(0, Math.min(1, p.ap - i));
        ctx.fillStyle = p.bank
          ? 'rgba(253,202,0,'+(0.25+0.7*f).toFixed(2)+')'
          : 'rgba(255,255,255,'+(0.18+0.72*f).toFixed(2)+')';
        ctx.beginPath(); ctx.arc(X-CELL*0.22+i*CELL*0.22, Y-CELL*0.55, CELL*0.055, 0, 7); ctx.fill();
      }
    }
  }

  // 特效
  fx = fx.filter(f=>now-f.t0 < 500);
  for(const f of fx){
    if (f.type==='wallpop'){
      const t=(now-f.t0)/300, e=1-Math.pow(1-Math.min(1,t),2);
      ctx.save(); ctx.globalAlpha=(1-t)*0.7;
      ctx.strokeStyle='#fff'; ctx.lineWidth=WT+6*e;
      ctx.lineCap='round';
      ctx.beginPath();
      if(f.kind==='h'){ ctx.moveTo(px(f.x),px(f.y)); ctx.lineTo(px(f.x+2),px(f.y)); }
      else{ ctx.moveTo(px(f.x),px(f.y)); ctx.lineTo(px(f.x),px(f.y+2)); }
      ctx.stroke(); ctx.restore();
    }
  }
  drawConfetti(dt);

  if (toastMsg){
    const t=(now-toastMsg.t0)/1400;
    if(t>1) toastMsg=null;
    else{
      ctx.save(); ctx.globalAlpha=t<0.85?1:(1-t)/0.15;
      ctx.font='600 14px "PingFang SC",sans-serif';
      const wtxt=ctx.measureText(toastMsg.text).width+30;
      rr(boardPx/2-wtxt/2, boardPx-40, wtxt, 28, 14);
      ctx.fillStyle='rgba(10,15,26,.9)'; ctx.fill();
      ctx.strokeStyle='#2a3a63'; ctx.stroke();
      ctx.fillStyle='#dfe7f5'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(toastMsg.text, boardPx/2, boardPx-26);
      ctx.restore();
    }
  }
  requestAnimationFrame(draw);
}
function spawnConfetti(){
  for(let i=0;i<150;i++){
    confetti.push({
      x:Math.random()*boardPx, y:-20-Math.random()*boardPx*0.6,
      vx:(Math.random()-0.5)*60, vy:70+Math.random()*150,
      s:3+Math.random()*5, c:`hsl(${Math.floor(Math.random()*360)},90%,60%)`,
      rot:Math.random()*7, vr:(Math.random()-0.5)*8,
    });
  }
}
function drawConfetti(dt){
  if (winner && winner!=='draw' && confetti.length){
    const dpr = window.devicePixelRatio||1;
    ctx.save();
    for(const c of confetti){
      c.x+=c.vx*dt; c.y+=c.vy*dt; c.rot+=c.vr*dt;
      if(c.y>boardPx+20){ c.y=-20; c.x=Math.random()*boardPx; }
      ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot);
      ctx.fillStyle=c.c; ctx.fillRect(-c.s/2,-c.s/2,c.s,c.s*1.6);
      ctx.restore();
    }
    ctx.restore();
  }
}

/* ================= 侧栏 ================= */
function buildPanel(){
  const el=document.getElementById('plist'); el.innerHTML='';
  for(const p of players){
    const row=document.createElement('div');
    row.className='prow'; row.id='prow-'+p.color;
    row.style.color=COLORS[p.color].main;
    row.innerHTML=`
      <span class="dot"></span>
      <span class="pname" style="color:var(--text)">${COLORS[p.color].name}
        ${p.human&&(mode==='pve'||mode==='sync')?'<span class="tagyou">你</span>':''}
        ${p.ai?'<span style="font-size:10px;color:var(--dim)">AI</span>':''}</span>
      <span class="wnum" title="剩余墙数">墙 ×${wallStock}</span>
      <span class="steps"></span>`;
    el.appendChild(row);
  }
}
function renderPanel(){
  const dists = winner? null : allDists();
  for(const p of players){
    const row=document.getElementById('prow-'+p.color); if(!row) continue;
    row.classList.toggle('active', !winner && p===cur());
    const wn=row.querySelector('.wnum');
    if (wn) wn.textContent='墙 ×'+p.walls;
    const steps=row.querySelector('.steps');
    if (winner===p) steps.textContent='👑 赢';
    else if (dists && dists[p.color]>=0) steps.textContent='距王座 '+dists[p.color];
    else steps.textContent='—';
  }
}
function syncSelects(){
  document.getElementById('modeSel').value = mode;
  document.getElementById('sizeSel').value = String(N);
  document.getElementById('wallSel').value = String(wallStock);
  document.getElementById('btnSpeed').textContent = fastAI? '⚡ 极速' : '⚡ 正常';
}
function refreshHint(){
  document.getElementById('hint').innerHTML = isSyncMode()
    ? '<b>同步模式</b>：没有回合，所有人同时行动！<br>'+
      '每人 <b>3 个操作点</b>（上限3）：走一步 / 放一堵墙各耗 1 点。<br>'+
      '动作间隔 <b>0.5 秒</b>，每秒恢复 1 点。<br>'+
      '先踏上中央 👑 王座者获胜'+(mode==='syncspec'?'。4 个 AI 实时互坑，会攒点蓄力、满点连发':'——AI 会攒点蓄力、满点连发，手速与规划并重！')
    : '<b>每回合二选一</b><br>'+
      '① 点击相邻格子 = 走一步（可跳过贴脸的棋子）<br>'+
      '② 点击格线缝隙 = 放一堵墙（占2格，永久，自己颜色）<br>'+
      '<b>获胜</b>：第一个踏上中央 👑 王座。<br>'+
      '墙不能穿过、不能重叠，也不许把任何人<b>彻底堵死</b>。';
}

/* ================= 按钮 ================= */

    <h2>玩法</h2>

      ① <b>移动</b>：棋子走一格（上下左右），不能穿墙、不能叠人；贴脸时可<b>跳</b>过去。<br>
      ② <b>放墙</b>：一堵墙占 2 格边，永久存在，用你的颜色。<br>
      <b>第一个踏上中央王座 👑 的人获胜。</b><br>
      规则保护：不许放墙把任何玩家彻底堵死——谁都得起码留一条活路。<br>
      <b>同步模式</b>：取消回合，四人同时行动。每人 3 个操作点（上限3），走子/放墙各耗 1 点，动作间隔 0.5 秒，每秒恢复 1 点。<br>
      没有队友，没有谈判。<b>4位玩家，1位赢家，0个朋友。</b>
    </div>
    <div class="legend">
      <span style="color:#0f9ceb"><i></i>蓝</span><span style="color:#17d76c"><i></i>绿</span>
      <span style="color:#e02955"><i></i>红</span><span style="color:#f5a307"><i></i>橙</span>
    </div>
    <button class="primary" id="btnOk">${first?'开打！':'继续'}</button>`;

}
document.getElementById('btnNew').onclick = ()=>{ ac(); newGame(); };
document.getElementById('btnRules').onclick = ()=>showRules(false);
document.getElementById('btnMute').onclick = function(){
  muted=!muted; this.textContent = muted? '🔇 静音':'🔊 音效';
};
document.getElementById('btnSpeed').onclick = function(){
  fastAI=!fastAI; this.textContent = fastAI? '⚡ 极速':'⚡ 正常';
};
document.getElementById('modeSel').onchange = function(){ mode=this.value; newGame(); };
document.getElementById('sizeSel').onchange = function(){ setBoardSize(+this.value); newGame(); };
document.getElementById('wallSel').onchange = function(){ wallStock=+this.value; newGame(); };

/* ================= 启动 ================= */
layout();
newGame();
requestAnimationFrame(draw);
// 首次进入展示规则（带 seed 的自动化测试跳过）
if (!Q.get('seed')) showRules(true);
